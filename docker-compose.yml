services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: 4000
      DATABASE_URL: "${DATABASE_URL:-mongodb://mongo:27017/event-booking}"
      JWT_SECRET: "${JWT_SECRET:-change_me_please_in_env_file}"
      APP_URLS: "${APP_URLS:-http://localhost:${CLIENT_HOST_PORT:-8080}}"
    ports:
      - "${SERVER_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_GRAPHQL_HTTP_URL: "${VITE_GRAPHQL_HTTP_URL:-http://localhost:${SERVER_HOST_PORT:-4000}/graphql}"
        VITE_GRAPHQL_WS_URL: "${VITE_GRAPHQL_WS_URL:-ws://localhost:${SERVER_HOST_PORT:-4000}/graphql}"
        VITE_APP_DOMAIN: "${VITE_APP_DOMAIN:-http://localhost:${CLIENT_HOST_PORT:-8080}}"
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mongo_data:
